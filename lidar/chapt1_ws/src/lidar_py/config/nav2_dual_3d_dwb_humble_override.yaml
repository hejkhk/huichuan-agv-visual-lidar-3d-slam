# Humble real-vehicle profile: SmacPlanner2D plus collision-aware DWB.
# FollowPath uses a rotation shim for large rear-facing starts. The behavior
# tree selects FollowPathNoShim when the full swept circle is not clear.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    failure_tolerance: 2.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath", "FollowPathNoShim"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.07
      movement_time_allowance: 25.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.20
      stateful: true

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 2.80
      angular_disengage_threshold: 0.12
      forward_sampling_distance: 0.20
      rotate_to_heading_angular_vel: 0.157
      max_angular_accel: 0.50
      simulate_ahead_time: 2.0
      closed_loop: true
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      use_path_orientations: true
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.209
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.00
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.30
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle.scale: 20.0
      ObstacleFootprint.scale: 1.0
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 48.0
      GoalDist.scale: 12.0
      PreferForward.scale: 20.0
      PreferForward.penalty: 5.0
      PreferForward.strafe_x: 0.10
      PreferForward.strafe_theta: 1.01
      PreferForward.theta_scale: 0.0
      RotateToGoal.scale: 32.0
      RotateToGoal.max_angle: 3.14
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    FollowPathNoShim:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.08
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.209
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.00
      vx_samples: 14
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.30
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle.scale: 20.0
      ObstacleFootprint.scale: 1.0
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 48.0
      GoalDist.scale: 12.0
      PreferForward.scale: 20.0
      PreferForward.penalty: 5.0
      PreferForward.strafe_x: 0.10
      PreferForward.strafe_theta: 1.01
      PreferForward.theta_scale: 0.0
      RotateToGoal.scale: 32.0
      RotateToGoal.max_angle: 3.14
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.209]
    min_velocity: [-0.08, 0.0, -0.209]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
    max_accel: [0.40, 0.0, 0.60]
    max_decel: [-0.80, 0.0, -1.00]
    odom_topic: /odom
    odom_duration: 0.10

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 0

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.157
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 8
      height: 8
      resolution: 0.05
      footprint_padding: 0.01
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan_timed_v2_filtered
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 14.0
        inflation_radius: 0.49

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      footprint_padding: 0.01
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan_timed_v2_filtered
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
