# Humble port of the navigation profile that is actually exercised by
# all.beifen.  The surrounding launch keeps this project's 2D/3D costmap
# layers and /cmd_vel_safe arbiter; this file owns planning and control only.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    failure_tolerance: 2.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathNoShim"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50
      stateful: true

    # all.beifen uses DWB for normal tracking as well as its no-shim escape
    # controller.  Gear-2 linear speed is retained from this vehicle profile.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.15
      angular_disengage_threshold: 0.15
      forward_sampling_distance: 0.20
      rotate_to_heading_angular_vel: 0.209
      max_angular_accel: 0.60
      simulate_ahead_time: 2.0
      closed_loop: true
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      use_path_orientations: true
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.209
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.00
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        - PreferForward
      BaseObstacle.scale: 5.0
      ObstacleFootprint.scale: 1.0
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 2.0
      GoalAlign.forward_point_distance: 0.30
      PathDist.scale: 4.0
      GoalDist.scale: 30.0
      PreferForward.scale: 10.0
      PreferForward.penalty: 5.0
      PreferForward.strafe_x: 0.10
      PreferForward.strafe_theta: 1.01
      PreferForward.theta_scale: 0.0
      RotateToGoal.scale: 2.0
      RotateToGoal.max_angle: 3.14
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

    FollowPathNoShim:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.08
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.209
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.00
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        - PreferForward
      BaseObstacle.scale: 5.0
      ObstacleFootprint.scale: 1.0
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 2.0
      GoalAlign.forward_point_distance: 0.30
      PathDist.scale: 4.0
      GoalDist.scale: 30.0
      PreferForward.scale: 10.0
      PreferForward.penalty: 5.0
      PreferForward.strafe_x: 0.10
      PreferForward.strafe_theta: 1.01
      PreferForward.theta_scale: 0.0
      RotateToGoal.scale: 2.0
      RotateToGoal.max_angle: 3.14
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.209]
    min_velocity: [-0.08, 0.0, -0.209]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
    max_accel: [0.40, 0.0, 0.60]
    max_decel: [-0.80, 0.0, -1.00]
    odom_topic: /odom
    odom_duration: 0.10

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # all.beifen's runnable Humble entry point uses NavFn with A*.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.50
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.40
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.209
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 8
      height: 8
      resolution: 0.05
      footprint_padding: 0.01
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.10

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      footprint_padding: 0.01
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.10
