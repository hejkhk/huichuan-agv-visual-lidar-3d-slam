# ROS 2 Humble frontier exploration profile.
frontier_explorer:
  ros__parameters:
    use_sim_time: false
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: /navigate_to_pose
    global_frame: map
    robot_base_frame: base_link
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: /exploration_complete
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: false
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1
    autostart: false
    control_service_enabled: true
    completion_event_enabled: true
    return_to_start_on_complete: false
    escape_enabled: true
    map_processing_rate_hz: 0.5
    completion_confirmation_count: 8
    complete_when_all_frontiers_suppressed: true
    all_frontiers_suppressed_confirmation_count: 8
    all_frontiers_suppressed_max_known_cell_growth: 20
    mrtsp_solver: greedy
    dp_solver_candidate_limit: 12
    dp_planning_horizon: 8
    weight_distance_wd: 1.2
    weight_gain_ws: 1.0
    max_linear_speed_vmax: 0.20
    max_angular_speed_wmax: 0.209
    sensor_effective_range_m: 1.5
    frontier_selection_min_distance: 1.2
    frontier_candidate_min_goal_distance_m: 1.2
    frontier_visit_tolerance: 0.60
    occ_threshold: 65
    min_frontier_size_cells: 9
    frontier_map_optimization_enabled: true
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1
    goal_preemption_enabled: false
    goal_preemption_min_interval_s: 5.0
    goal_preemption_complete_if_within_m: 0.0
    goal_preemption_lidar_range_m: 10.0
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 2.0
    goal_preemption_lidar_min_reveal_length_m: 0.5
    goal_preemption_lidar_yaw_offset_deg: 0.0
    goal_skip_on_blocked_goal: true
    active_goal_blocked_cancel_enabled: false
    post_goal_settle_enabled: true
    post_goal_min_settle: 1.5
    frontier_suppression_enabled: true
    frontier_suppression_attempt_threshold: 2
    frontier_suppression_base_size_m: 1.2
    frontier_suppression_expansion_size_m: 0.6
    frontier_suppression_timeout_s: 300.0
    frontier_suppression_no_progress_timeout_s: 30.0
    frontier_suppression_progress_epsilon_m: 0.10
    frontier_suppression_startup_grace_period_s: 20.0
    frontier_suppression_max_attempt_records: 256
    frontier_suppression_max_regions: 64
    all_frontiers_suppressed_behavior: stay
