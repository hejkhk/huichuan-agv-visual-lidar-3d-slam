# Merge this block into the Jazzy Nav2 local_costmap when enabling 3D avoidance.
# The global costmap must continue using the 2D LiDAR/map; only the local
# costmap consumes the fast STEP10V2.1 cloud.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "depth_voxel_layer", "inflation_layer"]
      depth_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: true
        origin_z: -0.20
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.40
        mark_threshold: 1
        unknown_threshold: 15
        observation_sources: gemini2_local
        gemini2_local:
          topic: /local_highres_cloud_v21
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_min_range: 0.15
          obstacle_max_range: 3.50
          raytrace_min_range: 0.15
          raytrace_max_range: 4.00
          min_obstacle_height: 0.03
          max_obstacle_height: 1.40
          expected_update_rate: 0.0
          observation_persistence: 0.0
