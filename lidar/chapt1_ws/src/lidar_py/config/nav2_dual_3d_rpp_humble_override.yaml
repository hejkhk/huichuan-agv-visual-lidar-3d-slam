# Humble-compatible controller/planner override. Values mirror the validated
# Jazzy RPP profile; only parameters unavailable in Nav2 Humble are omitted.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    failure_tolerance: 2.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.07
      movement_time_allowance: 12.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.20
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.58
      lookahead_time: 1.50
      transform_tolerance: 0.30
      min_approach_linear_velocity: 0.07
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.50
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.40
      regulated_linear_scaling_min_speed: 0.07
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 14.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.05
      rotate_to_heading_angular_vel: 0.157
      max_angular_accel: 0.50
      allow_reversing: false
      max_robot_pose_search_dist: 6.0
      use_interpolation: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.209]
    min_velocity: [-0.08, 0.0, -0.209]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
    max_accel: [0.40, 0.0, 0.60]
    max_decel: [-0.80, 0.0, -1.00]
    odom_topic: /odom
    odom_duration: 0.10

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 0

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.157
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 8
      height: 8
      resolution: 0.05
      footprint_padding: 0.01
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan_timed_v2_filtered
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 14.0
        inflation_radius: 0.49

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      footprint_padding: 0.01
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan_timed_v2_filtered
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
