# ROS 2 Humble / Ubuntu 22.04 Nav2 base profile.
# Cartographer remains the sole map->odom authority.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Humble does not append the built-in BT libraries automatically.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.333, -0.333], [-0.333, 0.333], [0.333, 0.333], [0.333, -0.333]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: depth_virtual scan
        depth_virtual:
          topic: /depth_obstacle_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.18
          obstacle_max_range: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 1.35
          observation_persistence: 0.35
          expected_update_rate: 0.15
        scan:
          topic: /scan_timed_v2_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.333, -0.333], [-0.333, 0.333], [0.333, 0.333], [0.333, -0.333]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_virtual scan
        depth_virtual:
          topic: /depth_obstacle_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.18
          obstacle_max_range: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 1.35
          observation_persistence: 0.35
          expected_update_rate: 0.15
        scan:
          topic: /scan_timed_v2_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    # Humble behavior_server has one collision-checking costmap interface.
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    max_rotational_vel: 0.209
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.50

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 20.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
