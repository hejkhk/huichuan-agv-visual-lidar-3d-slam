# Deterministic differential-drive navigation for the dual 2D/3D branch.
#
# SmacPlanner2D owns the collision-free global centre path. Regulated Pure
# Pursuit follows that path continuously and checks the full footprint along
# its commanded arc. The independent C++ 2D/3D gate remains the final stop
# authority for obstacles too close to the chassis.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # Let the rolling costmap settle and clear the current footprint before a
    # transient collision prediction escalates into a full recovery sequence.
    failure_tolerance: 2.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      # Small left/right corrections must not reset the progress timer forever.
      required_movement_radius: 0.07
      required_movement_angle: 0.35
      # Longer than the 8 s global RGB-D decay, so a deliberate obstacle stop
      # is not mistaken for a stuck chassis while a replacement path is being
      # computed by the bounded 1 Hz planning pipeline.
      movement_time_allowance: 12.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      # Point navigation is complete at the selected position. The RViz arrow
      # is a path hint, not a reason to circle the target indefinitely.
      yaw_goal_tolerance: 3.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Navigation gear 2 from 速度.txt.
      desired_linear_vel: 0.20
      # Keep the carrot close enough to follow the doorway centreline instead
      # of cutting across a jamb with the square chassis.
      lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.58
      lookahead_time: 1.50
      transform_tolerance: 0.30

      # Slow continuously near the goal, but never emit the ineffective
      # millimetre-per-second commands seen in the MPPI runs.
      min_approach_linear_velocity: 0.07
      approach_velocity_scaling_dist: 0.60

      # Simulate the complete rectangular footprint along the next arc.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.50

      # At a 0.85 m path radius this formula requests about 0.12 m/s and
      # 0.14 rad/s, matching the measured second differential gear.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.40
      regulated_linear_scaling_min_speed: 0.07
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.35
      interpolate_curvature_after_goal: true

      # Slow to a usable 7 cm/s near doorway costs. This gives RPP time to
      # align with the centreline without reviving ineffective turtle speeds.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 14.0

      # Ordinary bends remain arcs. A doorway path more than about 60 degrees
      # away is aligned before advancing instead of turning through the jamb.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.05
      rotate_to_heading_angular_vel: 0.157
      max_angular_accel: 0.50
      allow_reversing: false
      max_robot_pose_search_dist: 6.0
      stateful: true

# Open-loop interpolation smooths commands without feeding delayed/noisy odom
# back into the velocity limiter. RPP itself is the closed-loop path tracker.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.209]
    min_velocity: [-0.08, 0.0, -0.209]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
    max_accel: [0.40, 0.0, 0.60]
    # Cross zero promptly when a guarded BackUp recovery follows a forward
    # command; the old limiter could continue creeping forward for a second.
    max_decel: [-0.80, 0.0, -1.00]
    odom_topic: /odom
    odom_duration: 0.10
    use_realtime_priority: false
    enable_stamped_cmd_vel: false
    stamp_smoothed_velocity_with_smoothing_time: false

# Grid planning is appropriate for a four-wheel differential chassis because
# it can rotate in place. Smac's internal smoother avoids a second action
# server rewriting the path while FollowPath is active.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      # Never plan through unobserved space. Allowing unknown traversal can
      # route around the outside edge of a partially built Cartographer map.
      # Doorway reachability must be fixed in observed costmap cells instead.
      allow_unknown: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Use Nav2's balanced cost-aware value so the center path does not trade
      # wall clearance for a few centimetres of geometric distance.
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      # SmacPlanner2D always invokes its internal smoother and does not read the
      # Hybrid/Lattice-only smooth_path switch. In Jazzy, max_iterations=0 is
      # the supported 2D bypass. RPP turns this collision-safe 5 cm grid path
      # into continuous motion without shortcutting a narrow wall corner.
      smoother:
        max_iterations: 0

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.157
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.50
    enable_stamped_cmd_vel: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 8
      height: 8
      resolution: 0.05
      # The footprint already contains the measured 66.5 cm body. Keep a real
      # 1 cm margin without consuming another 4 cm of doorway width.
      footprint_padding: 0.01
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan_timed_v2_filtered
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 0.49 m is the narrowest rounded value still above the padded square's
        # approximately 0.485 m circumscribed radius. The complete rectangular
        # footprint remains the hard collision boundary.
        cost_scaling_factor: 14.0
        inflation_radius: 0.49

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      footprint_padding: 0.01
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan_timed_v2_filtered
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
