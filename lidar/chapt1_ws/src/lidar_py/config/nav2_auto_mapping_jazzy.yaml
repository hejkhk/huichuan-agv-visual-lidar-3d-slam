# Native ROS 2 Jazzy Nav2 profile adapted from auto_mapping_v1 for the real AGV.
# Cartographer remains the map->odom authority; Nav2 consumes /map and /odom.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    plugin_lib_names: ["short_goal_behind_bt_node"]

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathNoShim"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # Gear 2 navigation: 0.20 m/s and 12 deg/s. Rotation Shim is the native
    # Jazzy implementation from auto_mapping_v1.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 2.80
      angular_disengage_threshold: 0.10
      forward_sampling_distance: 0.20
      rotate_to_heading_angular_vel: 0.209
      max_angular_accel: 1.20
      simulate_ahead_time: 2.0
      closed_loop: true
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      use_path_orientations: true
      primary_controller: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.05
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.209
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.50
      acc_lim_y: 0.0
      acc_lim_theta: 1.20
      decel_lim_x: -0.50
      decel_lim_y: 0.0
      decel_lim_theta: -1.20
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.40
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle:
        scale: 20.0
      ObstacleFootprint:
        scale: 1.0
        sum_scores: false
      PathAlign:
        scale: 16.0
        forward_point_distance: 0.10
      GoalAlign:
        scale: 8.0
        forward_point_distance: 0.10
      PathDist:
        scale: 48.0
      GoalDist:
        scale: 12.0
      PreferForward:
        scale: 20.0
        penalty: 5.0
        strafe_x: 0.10
        strafe_theta: 1.01
        theta_scale: 0.0
      RotateToGoal:
        scale: 32.0
        max_angle: 3.14
        slowing_factor: 5.0
        lookahead_time: -1.0

    # Used by the imported behavior tree when an in-place sweep is blocked.
    FollowPathNoShim:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.05
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.209
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.50
      acc_lim_y: 0.0
      acc_lim_theta: 1.20
      decel_lim_x: -0.50
      decel_lim_y: 0.0
      decel_lim_theta: -1.20
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.40
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle:
        scale: 20.0
      ObstacleFootprint:
        scale: 1.0
        sum_scores: false
      PathAlign:
        scale: 16.0
        forward_point_distance: 0.10
      GoalAlign:
        scale: 8.0
        forward_point_distance: 0.10
      PathDist:
        scale: 48.0
      GoalDist:
        scale: 12.0
      PreferForward:
        scale: 20.0
        penalty: 5.0
        strafe_x: 0.10
        strafe_theta: 1.01
        theta_scale: 0.0
      RotateToGoal:
        scale: 32.0
        max_angle: 3.14
        slowing_factor: 5.0
        lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.333, -0.333], [-0.333, 0.333], [0.333, 0.333], [0.333, -0.333]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: depth_virtual scan
        depth_virtual:
          topic: /depth_obstacle_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.18
          obstacle_max_range: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 1.35
          observation_persistence: 0.35
          expected_update_rate: 0.15
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.58
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.333, -0.333], [-0.333, 0.333], [0.333, 0.333], [0.333, -0.333]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_virtual scan
        depth_virtual:
          topic: /depth_obstacle_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.18
          obstacle_max_range: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 1.35
          observation_persistence: 0.35
          expected_update_rate: 0.15
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.58
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      tolerance: 0.50
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      cost_penalty: 2.0
      reverse_penalty: 8.0
      change_penalty: 0.0
      non_straight_penalty: 1.10
      rotation_penalty: 1.2
      retrospective_penalty: 0.015
      allow_reverse_expansion: false
      max_iterations: 500000
      max_on_approach_iterations: 1000
      lookup_table_size: 10.0
      max_planning_time: 5.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# Kept from auto_mapping_v1 so Jazzy has the native Constrained Smoother
# action available. The State Lattice planner also performs its fast built-in
# smoothing before DWB receives each path.
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.20
    smoother_plugins: ["SmoothPath"]
    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: true
      path_downsampling_factor: 3
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 0.0
      w_curve: 0.0
      w_dist: 0.0
      w_smooth: 3000.0
      w_cost: 0.000045
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 50.0
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.209
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.50

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 20.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
