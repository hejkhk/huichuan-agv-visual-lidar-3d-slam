# Native ROS 2 Jazzy Nav2 profile adapted from auto_mapping_v1 for the real AGV.
# Cartographer remains the map->odom authority; Nav2 consumes /map and /odom.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # Jazzy always appends its built-in BT plugins. Do not add an empty
    # plugin_lib_names list: rcl_yaml_param_parser turns [] into an unset
    # parameter and bt_navigator aborts during construction.
    # ROS 2 Jazzy uses the explicit blackboard key list. Include every action
    # used by the project BT so abort results are reported without fallback
    # warnings or missing recovery context.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - backup_error_code
      - spin_error_code

# Controller, planner, goal/progress checker and velocity limits live in
# nav2_dual_3d_rpp_override.yaml. Keeping this file free of retired controller
# plugins prevents parameter merging from silently reviving the old stack.
controller_server:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.333, -0.333], [-0.333, 0.333], [0.333, 0.333], [0.333, -0.333]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: depth_virtual scan
        depth_virtual:
          topic: /depth_obstacle_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.18
          obstacle_max_range: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 1.35
          observation_persistence: 0.35
          expected_update_rate: 0.15
        scan:
          topic: /scan_timed_v2_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.333, -0.333], [-0.333, 0.333], [0.333, 0.333], [0.333, -0.333]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_virtual scan
        depth_virtual:
          topic: /depth_obstacle_scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.18
          obstacle_max_range: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 1.35
          observation_persistence: 0.35
          expected_update_rate: 0.15
        scan:
          topic: /scan_timed_v2_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 14.0
        inflation_radius: 0.49
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    max_rotational_vel: 0.209
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.50

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 20.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
