name: Jazzy preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROS_DISTRO: jazzy
      CAR_JAZZY_BUILD_ROOT: /tmp/huichuan_agv_jazzy_ws
      CAR_VALIDATION_ROS_DOMAIN_ID: "187"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install project dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-empy \
            python3-lark \
            python3-pip \
            python3-rosdep \
            python3-yaml
          rosdep update
          rosdep install --from-paths "lidar/chapt1_ws/src" \
            --ignore-src --rosdistro jazzy -r -y

      - name: Build and configure every Nav2 server
        shell: bash
        run: ./validate_auto_mapping_jazzy.sh --build

      - name: Build web console
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web production build
        shell: bash
        working-directory: web
        run: |
          npm ci
          npm run build
