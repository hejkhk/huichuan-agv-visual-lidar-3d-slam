name: Humble preflight

on:
  push:
    branches: [main, jetson]
  pull_request:
    branches: [main, jetson]
  workflow_dispatch:

concurrency:
  group: humble-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ROS_DISTRO: humble
      CAR_HUMBLE_BUILD_ROOT: /tmp/huichuan_agv_humble_ws
      CAR_VALIDATION_ROS_DOMAIN_ID: "187"
      # Hardware/vendor packages are validated on the robot. The hosted runner
      # has no Orbbec apt package and currently has a Cartographer libunwind
      # resolver conflict, neither of which is needed to compile our packages.
      CAR_VALIDATION_SKIP_EXTERNAL: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install project dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-empy \
            python3-lark \
            python3-pip \
            python3-rosdep \
            python3-yaml
          rosdep update
          rosdep install --from-paths "lidar/chapt1_ws/src" \
            --ignore-src --rosdistro humble -r -y \
            --skip-keys "orbbec_camera cartographer_ros libgoogle-glog-dev"

      - name: Build and validate Humble stack
        shell: bash
        run: ./validate_auto_mapping_humble.sh --build

      - name: Build web console
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web production build
        shell: bash
        working-directory: web
        run: |
          npm ci
          npm run build

  ui-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_IM_MODULE: qtvirtualkeyboard
      ROBOT_API_MODE: mock

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: CAR UI V5.2/requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse0 libxkbcommon0

      - name: Install UI dependencies
        working-directory: CAR UI V5.2
        run: python -m pip install -r requirements-dev.txt

      - name: Validate UI and combined launcher
        shell: bash
        run: |
          python -m compileall -q \
            "CAR UI V5.2/main.py" \
            "CAR UI V5.2/backend" \
            "CAR UI V5.2/robot_api"
          bash -n \
            START_UI_LOCALIZATION_NAVIGATION.sh \
            START_DUAL_2D_3D_LOCALIZATION.sh \
            "CAR UI V5.2/run.sh"
          python -m pytest -q "CAR UI V5.2/tests"
